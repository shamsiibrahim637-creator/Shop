<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<title>Cable Tie Billing</title>
<link rel="manifest" href="cabletie.webmanifest">
<link rel="icon" href="cabletie-icon-192.png">
<link rel="apple-touch-icon" href="cabletie-icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="caps.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<style>
  :root{ --gold:#f0c341; --gold-2:#b8912f; --bg:#050505; --card:#141414; --line:#2a2a2a; --text:#f2e8cf; --muted:#9a9a9a; --green:#4cd07d; --red:#ef6b5b; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:Arial, sans-serif; -webkit-tap-highlight-color:transparent; }
  header{ display:flex; align-items:center; gap:8px; padding:10px 14px; position:sticky; top:0; z-index:5; background:rgba(5,5,5,0.96); border-bottom:1px solid var(--line); }
  header h1{ flex:1; margin:0; font-family:Georgia, serif; color:var(--gold); font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hbtn{ background:none; border:1.5px solid var(--line); color:#c9c9c9; border-radius:8px; padding:7px 10px; font-weight:800; font-size:13px; text-decoration:none; white-space:nowrap; }
  .wrap{ max-width:640px; margin:0 auto; padding:12px 14px 80px; }
  .tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .tab{ flex:1; padding:11px 4px; border-radius:10px; border:1.5px solid var(--gold-2); background:none; color:var(--gold); font-weight:800; font-size:13px; }
  .tab.active{ background:var(--gold); color:#000; }
  .page{ display:none; } .page.active{ display:block; }
  .card{ background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card h2{ margin:0 0 10px; font-size:13px; letter-spacing:1px; color:var(--gold); }
  label.lb{ display:block; font-size:12px; color:var(--muted); font-weight:700; margin:10px 0 5px; }
  input, select, textarea{ width:100%; padding:10px; border-radius:8px; border:1.5px solid #333; background:#0b0b0b; color:#fff; font-size:15px; font-weight:700; font-family:Arial,sans-serif; }
  .row{ display:flex; gap:8px; } .row > div{ flex:1; min-width:0; }
  .btn{ border:none; border-radius:10px; padding:12px; font-weight:800; font-size:15px; cursor:pointer; }
  .btn.gold{ background:var(--gold); color:#000; } .btn.ghost{ background:none; border:1.5px solid #3a3a3a; color:#ddd; }
  .btn.green{ background:#1f7a46; color:#fff; } .btn.red{ background:#3a1210; color:#ff8a80; border:1.5px solid #5a2a25; }
  .btns{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; } .btns .btn{ flex:1; min-width:130px; }
  .note{ font-size:12px; color:var(--muted); line-height:1.5; margin-top:6px; }
  .cats{ display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; }
  .cat{ background:#0d0d0d; border:2px solid #2a2a2a; border-radius:12px; padding:6px; text-align:center; color:#ddd; font-weight:800; font-size:12px; }
  .cat img{ width:100%; height:92px; object-fit:contain; background:#fff; border-radius:8px; display:block; margin-bottom:5px; }
  .cat.on{ border-color:var(--gold); color:var(--gold); }
  .grp{ font-size:12px; font-weight:900; color:var(--gold-2); margin:12px 0 4px; letter-spacing:1px; }
  .size{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #222; }
  .size .m{ flex:1; font-weight:800; font-size:15px; }
  .size .p{ font-weight:900; color:var(--green); min-width:62px; text-align:right; }
  .size input{ width:62px; padding:8px 4px; text-align:center; }
  .size .btn{ padding:9px 12px; font-size:14px; }
  .it{ display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid #222; }
  .it .nm{ flex:1; font-weight:800; font-size:14px; line-height:1.3; }
  .it .nm small{ color:var(--muted); font-weight:700; }
  .it input{ width:62px; padding:7px 4px; text-align:center; }
  .it .amt{ min-width:72px; text-align:right; font-weight:900; }
  .x{ background:none; border:1.5px solid #5a2a25; color:#ff8a80; border-radius:8px; padding:6px 9px; font-weight:900; }
  .trow{ display:flex; justify-content:space-between; padding:6px 0; font-size:15px; font-weight:700; }
  .trow.big{ font-size:20px; font-weight:900; color:var(--gold); border-top:1.5px solid #333; margin-top:6px; padding-top:10px; }
  .tog{ display:flex; align-items:center; gap:10px; padding:9px 0; font-weight:800; }
  .tog input[type=checkbox]{ width:22px; height:22px; accent-color:var(--gold); }
  .bill{ background:#0d0d0d; border:1.5px solid #2a2a2a; border-radius:12px; padding:12px; margin-bottom:10px; }
  .bill .t1{ display:flex; justify-content:space-between; font-weight:900; }
  .bill .t2{ color:var(--muted); font-size:13px; margin-top:4px; }
  .bill .btns .btn{ min-width:70px; padding:9px; font-size:13px; }
  .badge{ font-size:11px; padding:3px 7px; border-radius:6px; font-weight:900; }
  .badge.paid{ background:#123b22; color:#7be3a2; } .badge.due{ background:#3b2a10; color:#f5c46b; }
  .plrow{ display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .plrow input{ padding:8px; font-size:14px; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#222; color:#fff; padding:11px 16px; border-radius:10px; font-weight:700; font-size:14px; z-index:200; display:none; border:1px solid #444; max-width:90%; text-align:center; }
  #lock{ position:fixed; inset:0; z-index:100; background:#050505; display:none; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  #sync{ font-size:11px; color:var(--muted); font-weight:700; }
</style>
</head>
<body>
<header>
  <h1>🔗 Cable Tie Billing</h1>
  <span id="sync"></span>
  <a class="hbtn" href="index.html">🏠</a>
  <button class="hbtn" id="install-btn" style="background:var(--gold); color:#000; border-color:var(--gold);">📲 Add</button>
</header>
<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-p="pg-bill">🧾 New bill</button>
    <button class="tab" data-p="pg-list">📜 Bills</button>
    <button class="tab" data-p="pg-price">💲 Price list</button>
  </div>

  <!-- =============== NEW BILL =============== -->
  <div class="page active" id="pg-bill">
    <div class="card">
      <h2 id="bill-head">ESTIMATE</h2>
      <div class="row">
        <div><label class="lb">Estimate no.</label><input type="number" id="b-no" inputmode="numeric"></div>
        <div><label class="lb">Date</label><input type="date" id="b-date"></div>
      </div>
      <label class="lb">Customer name</label><input type="text" id="b-name" list="cust-list" placeholder="Customer / firm name"><datalist id="cust-list"></datalist>
      <div class="row">
        <div><label class="lb">Phone</label><input type="tel" id="b-phone" inputmode="tel" placeholder="Mobile"></div>
        <div><label class="lb">GSTIN (optional)</label><input type="text" id="b-gstin" placeholder="Customer GST no."></div>
      </div>
      <label class="lb">Address (optional)</label><input type="text" id="b-addr">
    </div>

    <div class="card">
      <h2>ADD CABLE TIES</h2>
      <input type="text" id="psearch" placeholder="🔍 Search size e.g. 4.8 x 300, 12 inch, steel 200, black" style="margin-bottom:10px;">
      <div class="cats" id="cats"></div>
      <div id="sizes"></div>
      <details style="margin-top:12px;"><summary style="font-weight:800; color:var(--gold);">＋ Other item (not in list)</summary>
        <div class="row"><div style="flex:2;"><label class="lb">Item</label><input type="text" id="m-name"></div><div><label class="lb">Rate ₹</label><input type="number" inputmode="decimal" id="m-rate"></div><div><label class="lb">Qty</label><input type="number" inputmode="decimal" id="m-qty" value="1"></div></div>
        <div class="btns"><button class="btn ghost" id="m-add">＋ Add item</button></div>
      </details>
    </div>

    <div class="card">
      <h2>ITEMS IN THIS BILL</h2>
      <div id="items"></div>
      <div class="tog"><input type="checkbox" id="pk-on"><label for="pk-on" style="flex:1;">Packing charge</label><input type="number" inputmode="decimal" id="pk-amt" placeholder="₹" style="width:110px;"></div>
      <div class="tog"><input type="checkbox" id="gst-on"><label for="gst-on" style="flex:1;">Add GST</label><input type="number" inputmode="decimal" id="gst-rate" value="18" style="width:80px;"><span style="font-weight:800;">%</span></div>
      <label class="lb">Transport (optional)</label><input type="text" id="b-transport" placeholder="e.g. VRL, Blue Dart, self pickup">
      <div id="totals" style="margin-top:10px;"></div>
      <div class="tog"><input type="checkbox" id="paid-on"><label for="paid-on">Payment received (mark as PAID)</label></div>
      <div class="btns"><button class="btn gold" id="save">💾 Save bill</button><button class="btn ghost" id="new">🆕 Clear / new</button></div>
      <div class="btns"><button class="btn green" id="wa">💬 WhatsApp</button><button class="btn ghost" id="pdf">📄 PDF</button></div>
    </div>
  </div>

  <!-- =============== BILL LIST =============== -->
  <div class="page" id="pg-list">
    <div class="card">
      <input type="text" id="search" placeholder="🔍 Search name, phone or estimate no.">
      <div id="sum" class="note"></div>
    </div>
    <div id="bills"></div>
  </div>

  <!-- =============== PRICE LIST =============== -->
  <div class="page" id="pg-price">
    <div class="card">
      <h2>SHOP DETAILS (ON PDF)</h2>
      <label class="lb">Shop name</label><input type="text" id="s-name">
      <div class="row"><div><label class="lb">Phone</label><input type="tel" id="s-phone"></div><div><label class="lb">Your GSTIN</label><input type="text" id="s-gstin"></div></div>
      <label class="lb">Address</label><input type="text" id="s-addr">
      <div class="btns"><button class="btn gold" id="s-save">💾 Save shop details</button></div>
    </div>
    <div class="card">
      <h2>PRICES</h2>
      <select id="pl-cat"></select>
      <div class="row" style="margin-top:8px;"><div><label class="lb">Sold per</label><input type="text" id="pl-unit" placeholder="PKT"></div><div style="flex:0 0 auto;"><label class="lb">Photo</label><button class="btn ghost" id="pl-photo" style="padding:9px 12px;">📷 Change</button></div></div>
      <input type="file" id="pl-file" accept="image/*" style="display:none;">
      <div class="note">Size group (inch) · Model · Price ₹. Empty price = not available.</div>
      <div id="pl-rows" style="margin-top:8px;"></div>
      <div class="btns"><button class="btn ghost" id="pl-add">＋ Add size</button><button class="btn gold" id="pl-save">💾 Save prices</button></div>
      <button class="btn ghost" id="pl-reset" style="width:100%; margin-top:8px; font-size:13px;">↺ Reset this list to the original prices</button>
    </div>
    <div class="card">
      <h2>APP LOCK</h2>
      <div class="btns" style="margin-top:0;"><button class="btn ghost" id="pin-set">🔒 Set / change PIN</button><button class="btn ghost" id="pin-off">Remove PIN</button></div>
    </div>
  </div>
</div>

<div id="lock">
  <div style="font-size:44px;">🔒</div>
  <div style="font-family:Georgia,serif; color:var(--gold); font-size:22px; margin:6px 0 16px;">Cable Tie Billing</div>
  <input type="password" id="lock-pin" inputmode="numeric" maxlength="8" placeholder="PIN" style="max-width:240px; text-align:center; font-size:24px; letter-spacing:6px;">
  <button class="btn gold" id="lock-go" style="margin-top:12px; width:240px;">Unlock</button>
  <div id="lock-err" style="color:var(--red); font-weight:700; margin-top:10px; min-height:18px;"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ================= cloud (same Firebase as the Shop apps, saved under its own "ct-" names) =================
const firebaseConfig = { apiKey: "AIzaSyCAhRZkey-RTg2Xn_73EUCtd6dODXCUMHU", authDomain: "shopsync-5eacc.firebaseapp.com", projectId: "shopsync-5eacc", storageBucket: "shopsync-5eacc.firebasestorage.app", messagingSenderId: "751907155720", appId: "1:751907155720:web:e81466b303562c70fc06bd" };
let DB = null;
try { firebase.initializeApp(firebaseConfig); DB = firebase.firestore(); if (location.protocol === 'https:') DB.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) { console.warn('cloud off', e); }
const COLL = 'billing_kv', CHUNK = 900000;
const sid = (k) => String(k).replace(/\//g, '_SLASH_');
const cloud = {
  async get(key){
    if (!DB) throw new Error('offline');
    const c = DB.collection(COLL), s = await c.doc(sid(key)).get(); if (!s.exists) return null;
    const d = s.data(); if (!d.chunked) return d.value;
    const parts = await Promise.all(Array.from({ length: d.chunkCount || 0 }, (_, i) => c.doc(sid(key) + '__chunk' + i).get()));
    return parts.map(p => p.exists ? p.data().part : '').join('');
  },
  async set(key, value){
    if (!DB) throw new Error('offline');
    const c = DB.collection(COLL), str = String(value);
    let prev = 0; try { const p = await c.doc(sid(key)).get(); if (p.exists && p.data().chunked) prev = p.data().chunkCount || 0; } catch (e) {}
    if (str.length <= CHUNK){ await c.doc(sid(key)).set({ chunked: false, value: str, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); }
    else {
      const ch = []; for (let i = 0; i < str.length; i += CHUNK) ch.push(str.slice(i, i + CHUNK));
      await Promise.all(ch.map((part, i) => c.doc(sid(key) + '__chunk' + i).set({ part })));
      await c.doc(sid(key)).set({ chunked: true, chunkCount: ch.length, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      for (let i = ch.length; i < prev; i++) c.doc(sid(key) + '__chunk' + i).delete().catch(() => {});
    }
  },
  watch(key, fn){ if (DB) return DB.collection(COLL).doc(sid(key)).onSnapshot(() => fn(), () => {}); }
};
// local copy on the phone too (works without internet, synced when back online)
const local = { get: (k) => localStorage.getItem('ct:' + k), set: (k, v) => { try { localStorage.setItem('ct:' + k, v); } catch (e) {} } };
async function load(key, def){
  if (local.get('pending:' + key) && local.get(key) != null){ try { await cloud.set(key, local.get(key)); localStorage.removeItem('ct:pending:' + key); } catch (e) { return JSON.parse(local.get(key)); } }
  try { const v = await Promise.race([cloud.get(key), new Promise((_, r) => setTimeout(() => r(new Error('slow')), 12000))]); if (v != null){ local.set(key, v); return JSON.parse(v); } }
  catch (e) { const v = local.get(key); if (v != null) return JSON.parse(v); }
  const v = local.get(key); return v != null ? JSON.parse(v) : def;
}
async function store(key, obj){
  const v = JSON.stringify(obj); local.set(key, v);
  try { await cloud.set(key, v); setSync('☁️ saved'); return true; }
  catch (e) { setSync('📱 saved on phone'); local.set('pending:' + key, '1'); return false; }
}
function setSync(t){ $('sync').textContent = t; }

// ================= price lists =================
const N = (inch, model, w, b) => ({ inch, model, w, b });
const NYLON = [
  N('4"', '1.9 X 100', 9, 9.5), N('4"', '2.5 X 100', 13, 14),
  N('6"', '2 X 150', 15, 16), N('6"', '2.5 X 150', 22, 23), N('6"', '3.6 X 150', 28, 30),
  N('8"', '2.2 X 200', 23, 24), N('8"', '2.5 X 200', 28, 30), N('8"', '3.6 X 200', 38, 40), N('8"', '4.8 X 200', 55, 60),
  N('10"', '2.8 X 250', 38, 40), N('10"', '3.6 X 250', 50, 53), N('10"', '4.8 X 250', 70, 75),
  N('12"', '3 X 300', 47, 49), N('12"', '3.6 X 300', 61, 64), N('12"', '4.8 X 300', 83, 88), N('12"', '7.6 X 300', 155, 165),
  N('14"', '3.6 X 350', 71, 75), N('14"', '4.8 X 350', 105, 110),
  N('16"', '3.6 X 400', 90, 96), N('16"', '4.8 X 400', 120, 125), N('16"', '7.6 X 400', 200, 210),
  N('18"', '4.8 X 450', 150, 160), N('18"', '7.6 X 450', 260, 275),
  N('20"', '4.8 X 500', 170, 180), N('22"', '7.6 X 550', 400, 430), N('26"', '7.6 X 650', 480, 500),
  N('30.4"', '7.6 X 760', 550, 600), N('36.8"', '9 X 920', 1200, null)
];
const DEFAULT_CATS = [
  { id: 'nw', name: 'NYLON CABLE TIE - WHITE', short: 'NYLON WHITE', photo: 'ct-nylon-white.jpg', unit: 'PKT', sizes: NYLON.map(r => ({ inch: r.inch, model: r.model, price: r.w })) },
  { id: 'nb', name: 'NYLON CABLE TIE - BLACK', short: 'NYLON BLACK', photo: 'ct-nylon-black.jpg', unit: 'PKT', sizes: NYLON.filter(r => r.b != null).map(r => ({ inch: r.inch, model: r.model, price: r.b })) },
  { id: 'ss', name: 'STAINLESS STEEL CABLE TIE', short: 'STAINLESS STEEL', photo: 'ct-steel.jpg', unit: 'PKT', sizes: [100, 150, 200, 250, 300, 350, 400, 450].map((l, i) => ({ inch: (l / 25).toFixed(0) + '"', model: '4.6 X ' + l, price: [160, 190, 220, 250, 280, 320, 350, 380][i] })) },
  { id: 'mt', name: 'MARKER TIE', short: 'MARKER TIE', photo: 'ct-marker.jpg', unit: 'PKT', sizes: [{ inch: '4"', model: '2.5 X 100', price: 45 }] }
];
let CATS = JSON.parse(JSON.stringify(DEFAULT_CATS));
let PHOTOS = {};   // replaced photos (from your phone)
let SHOP = { name: 'TURNING POINT TROPHY', phone: '88501 40327', gstin: '', addr: '' };
let BILLS = [];

// ================= helpers =================
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const rs = (n) => '₹' + r2(n).toLocaleString('en-IN', { minimumFractionDigits: r2(n) % 1 ? 2 : 0, maximumFractionDigits: 2 });
const rsP = (n) => 'Rs. ' + r2(n).toLocaleString('en-IN', { minimumFractionDigits: r2(n) % 1 ? 2 : 0, maximumFractionDigits: 2 });
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = (s) => { if (!s) return ''; const [y, m, d] = s.split('-'); return d + '-' + m + '-' + y; };
function toast(t){ const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2400); }
const photoOf = (c) => PHOTOS[c.id] || c.photo;
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === t.dataset.p));
  if (t.dataset.p === 'pg-list') renderBills();
  if (t.dataset.p === 'pg-price') renderPriceList();
  window.scrollTo(0, 0);
});

// ================= new bill =================
let cur = blankBill(), curCat = 'nw';
function nextNo(){ return BILLS.reduce((m, b) => Math.max(m, Number(b.no) || 0), 0) + 1; }
function blankBill(){ return { id: null, no: null, date: today(), name: '', phone: '', gstin: '', addr: '', transport: '', items: [], packOn: false, pack: 0, gstOn: false, gstRate: Number(localStorage.getItem('ct-gst-rate')) || 18, paid: false }; }
const norm = (t) => String(t || '').toLowerCase().replace(/[×*]/g, 'x').replace(/\s*x\s*/g, 'x').replace(/["”]/g, ' inch ').replace(/\s+/g, ' ').trim();
function sizeRow(c, i){
  const s = c.sizes[i];
  return `<div class="size"><div class="m">${esc(s.model)}${$('psearch').value.trim() ? ' <small style="color:var(--muted);">' + esc(s.inch || '') + '</small>' : ''}</div><div class="p">${rs(s.price)}</div><input type="number" inputmode="numeric" min="1" value="1" id="q-${c.id}-${i}"><button class="btn gold" data-add="${c.id}:${i}">＋</button></div>`;
}
function renderCats(){
  const q = norm($('psearch').value);
  $('cats').style.display = q ? 'none' : '';
  $('cats').innerHTML = CATS.map(c => `<button type="button" class="cat ${c.id === curCat ? 'on' : ''}" data-c="${c.id}"><img src="${esc(photoOf(c))}" alt="">${esc(c.short || c.name)}</button>`).join('');
  $('cats').querySelectorAll('.cat').forEach(b => b.onclick = () => { curCat = b.dataset.c; renderCats(); });
  let h = '';
  if (q){
    const words = q.split(' ').filter(Boolean);
    let found = 0;
    CATS.forEach(c => {
      const rows = [];
      c.sizes.forEach((s, i) => {
        if (s.price == null || s.price === '') return;
        const hay = norm(c.name + ' ' + (c.short || '') + ' ' + s.model + ' ' + (s.inch || '')) + ' ' + norm(s.model).replace(/x/g, ' ');
        if (words.every(w => hay.includes(w) || (/^\d+(\.\d+)?$/.test(w) && hay.includes(w + ' inch')))) rows.push(sizeRow(c, i));
      });

function hashPin(pin, salt){ let h1 = 0xdeadbeef, h2 = 0x41c6ce57; const s = salt + ':' + pin + ':ct'; for (let r = 0; r < 300; r++) for (let i = 0; i < s.length; i++){ const ch = s.charCodeAt(i) + r; h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } return (h1 >>> 0).toString(36) + (h2 >>> 0).toString(36); }

$('pin-off').onclick = () => { if (getPin() && confirm('Remove the PIN?')){ localStorage.removeItem('ct-pin'); toast('PIN removed'); } };

  window.addEventListener('appinstalled', () => { btn.style.display = 'none'; });
  btn.onclick = async () => { if (deferred){ deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; return; } alert('Add it from the browser menu:\n\n• Chrome: tap ⋮ (top-right) → "Add to Home screen" (or "Install app")'); };
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
async function syncPending(){ for (const k of ['ct-bills', 'ct-prices', 'ct-photos', 'ct-settings']){ if (local.get('pending:' + k)){ try { await cloud.set(k, local.get(k)); localStorage.removeItem('ct:pending:' + k); } catch (e) {} } } }
(async function start(){
  lockIfNeeded();
  setSync('⏳');
  fillForm(); renderCats();
  await syncPending();
  const [bills, prices, photos, settings] = await Promise.all([load('ct-bills', []), load('ct-prices', null), load('ct-photos', {}), load('ct-settings', null)]);
  BILLS = Array.isArray(bills) ? bills : [];
  if (Array.isArray(prices) && prices.length) CATS = prices;
  PHOTOS = photos || {};
  if (settings) SHOP = settings;
  else { try { const s = await load('shop-settings', null); if (s && s.name) SHOP = { name: s.name, phone: s.phone || SHOP.phone, gstin: s.gstin || '', addr: s.address || '' }; } catch (e) {} }
  setSync(DB ? '☁️' : '📱');
  if (!cur.id && !cur.items.length) $('b-no').value = nextNo();
  renderCats(); custList();
  cloud.watch('ct-bills', async () => { try { const v = await cloud.get('ct-bills'); if (v){ local.set('ct-bills', v); BILLS = JSON.parse(v); custList(); if ($('pg-list').classList.contains('active')) renderBills(); if (!cur.id && !cur.items.length) $('b-no').value = nextNo(); } } catch (e) {} });
  window.addEventListener('online', syncPending);
})();
</script>
