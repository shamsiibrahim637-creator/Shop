// ---- Firebase init (shared across all three apps for live cross-device sync) ----

  projectId: "shopsync-5eacc",

  messagingSenderId: "751907155720",
  appId: "1:751907155720:web:e81466b303562c70fc06bd"
};
window.__firebaseReady = false;
try {
  firebase.initializeApp(firebaseConfig);
  window.__db = firebase.firestore();
  // Keep a copy on the phone (only possible on a real web address) — faster
  // repeat opens and it keeps working on a weak signal.
  if (location.protocol === 'https:'){
    window.__db.enablePersistence({ synchronizeTabs: true }).catch(err => console.warn('Offline copy not enabled:', err && err.code));
  }
  window.__firebaseReady = true;
} catch (err) {
  console.error('Firebase init failed:', err);
}

// ---- Shared cloud storage layer (Firestore), used by all three apps ------
// Every app already talks to `storage.get/set/delete(key[, value])` exactly
// like it did with IndexedDB — only the plumbing underneath changes.
//
// A single bill/purchase/catalogue-item list is saved as ONE JSON string
// under one key (e.g. "all-bills"). Firestore caps a single document at
// ~1MB, and that blob only grows over time as the shop's history builds up
// — so instead of trying to keep photos small enough to always fit in one
// document (which is what silently broke last time once the data grew),
// large values are transparently split across several small "chunk"
// documents and reassembled on read. This means saving can't silently fail
// just because the data got big.
const FIRESTORE_CHUNK_SIZE = 900000; // chars per chunk, safely under the ~1MB doc cap

function makeFirestoreStorage(collectionName){
  function coll(){ return window.__db.collection(collectionName); }
  function safeId(key){ return String(key).replace(/\//g, '_SLASH_'); }
  function chunkId(key, i){ return safeId(key) + '__chunk' + i; }

  return {
    async get(key){
      const snap = await coll().doc(safeId(key)).get();
      if (!snap.exists) return null;
      const data = snap.data();
      if (!data.chunked) return { key, value: data.value };
      const n = data.chunkCount || 0;
      const parts = await Promise.all(
        Array.from({ length: n }, (_, i) => coll().doc(chunkId(key, i)).get())
      );
      return { key, value: parts.map(p => (p.exists ? p.data().part : '')).join('') };
    },
    async set(key, value){
      let prevChunkCount = 0;
      try {
        const prevSnap = await coll().doc(safeId(key)).get();
        if (prevSnap.exists && prevSnap.data().chunked) prevChunkCount = prevSnap.data().chunkCount || 0;
      } catch (e) { /* no previous doc — nothing to clean up */ }

      const str = String(value);
      if (str.length <= FIRESTORE_CHUNK_SIZE){
        await coll().doc(safeId(key)).set({ chunked: false, value: str, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        if (prevChunkCount > 0){
          await Promise.all(Array.from({ length: prevChunkCount }, (_, i) => coll().doc(chunkId(key, i)).delete().catch(() => {})));
        }
        return { key, value: str };
      }

      const chunks = [];
      for (let i = 0; i < str.length; i += FIRESTORE_CHUNK_SIZE) chunks.push(str.slice(i, i + FIRESTORE_CHUNK_SIZE));
      await Promise.all(chunks.map((part, i) => coll().doc(chunkId(key, i)).set({ part })));
      await coll().doc(safeId(key)).set({ chunked: true, chunkCount: chunks.length, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      if (prevChunkCount > chunks.length){
        await Promise.all(Array.from({ length: prevChunkCount - chunks.length }, (_, i) =>
          coll().doc(chunkId(key, chunks.length + i)).delete().catch(() => {})
        ));
      }
      return { key, value: str };
    },
    async delete(key){
      try {
        const snap = await coll().doc(safeId(key)).get();
        if (snap.exists && snap.data().chunked){
          const n = snap.data().chunkCount || 0;
          await Promise.all(Array.from({ length: n }, (_, i) => coll().doc(chunkId(key, i)).delete().catch(() => {})));
        }
      } catch (e) { /* ignore — still try deleting the manifest below */ }
      await coll().doc(safeId(key)).delete();
      return { key, deleted: true };
    },
    async list(prefix){
      return { keys: [] }; // not used by any app — kept only for interface compatibility
    },
    // Recovery helper: every saved value whose key starts with `prefix`
    // (e.g. all products saved under one catalogue, even ones that have
    // dropped out of its product list). Reassembles chunked values.
    async listByPrefix(prefix){
      const FP = firebase.firestore.FieldPath.documentId();
      const start = safeId(prefix);
      const snap = await coll().where(FP, '>=', start).where(FP, '<', start + '\uf8ff').get();
      const out = [];
      for (const d of snap.docs){
        if (d.id.indexOf('__chunk') !== -1) continue;
        const key = d.id.replace(/_SLASH_/g, '/');
        const data = d.data() || {};
        let value = null;
        if (!data.chunked) value = data.value;
        else { const r = await this.get(key); value = r ? r.value : null; }
        if (value != null) out.push({ key, value });
      }
      return out;
    },
    // Bulk write for imports: writing hundreds of items one at a time (each
    // a separate get-then-set round trip) is what actually broke large
    // imports before — on a slow connection it can take so long the person
    // assumes it's done and leaves the page, so only the first few items
    // ever get saved. This uses Firestore's batch write instead, splitting
    // batches by BOTH item count (max 400, Firestore's own per-batch limit)
    // AND total data size (max ~8MB, safely under Firestore's ~10MB
    // per-request cap) — photos mean a batch can hit the size limit long
    // before it hits the count limit. Any single value still too big for
    // one chunk falls back to the normal chunked set() afterwards.
    async setMany(pairs){
      const MAX_BATCH_OPS = 400;
      const MAX_BATCH_BYTES = 8000000;
      const overflow = [];
      let batch = window.__db.batch();
      let opsInBatch = 0;
      let bytesInBatch = 0;

      for (const [key, value] of pairs){
        const str = String(value);
        if (str.length > FIRESTORE_CHUNK_SIZE){ overflow.push([key, value]); continue; }

        if (opsInBatch > 0 && (opsInBatch >= MAX_BATCH_OPS || bytesInBatch + str.length > MAX_BATCH_BYTES)){
          await batch.commit();
          batch = window.__db.batch();
          opsInBatch = 0;
          bytesInBatch = 0;
        }

        batch.set(coll().doc(safeId(key)), { chunked: false, value: str, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        opsInBatch++;
        bytesInBatch += str.length;
      }
      if (opsInBatch > 0) await batch.commit();

      for (const [key, value] of overflow){
        await this.set(key, value);
      }
    },
    async getAllEntries(){ return this.listByPrefix(''); },
    // Deletes everything in this collection except keepKeys.
    async clearAll(keepKeys){
      const keep = new Set(keepKeys || []);
      const all = await this.listByPrefix('');
      await Promise.all(all.filter(r => !keep.has(r.key)).map(r => this.delete(r.key).catch(() => null)));
    },
    // Real-time: cb(value) fires immediately with the current value, then
    // again every time this key changes on any device. Returns an unsubscribe
    // function.
    onChange(key, cb){
      return coll().doc(safeId(key)).onSnapshot(async (snap) => {
        if (!snap.exists){ cb(null); return; }
        const data = snap.data();
        if (!data.chunked){ cb(data.value); return; }
        const n = data.chunkCount || 0;
        try {
          const parts = await Promise.all(Array.from({ length: n }, (_, i) => coll().doc(chunkId(key, i)).get()));
          cb(parts.map(p => (p.exists ? p.data().part : '')).join(''));
        } catch (e) { console.error('Live update failed for', key, e); }
      }, (err) => console.error('Live sync error for', key, err));
    }
  };
}
</script>

<script>
// ---- PIN lock ----
// One PIN for the whole shop, stored (as a scrambled fingerprint, never the
// PIN itself) in the cloud so it's the same on every phone. Once a phone is
// unlocked it stays unlocked until you tap 🔒 → Lock now, or the PIN changes.
// Note: this keeps casual visitors out of the app screen; it is not the same
// as a full account login.
(function(){
  const lockEl = document.getElementById('pin-lock');
  const titleEl = document.getElementById('pin-title');
  const msgEl = document.getElementById('pin-msg');
  const in1 = document.getElementById('pin-input-1');
  const in2 = document.getElementById('pin-input-2');
  const goBtn = document.getElementById('pin-go-btn');
  const errEl = document.getElementById('pin-error');
  const helpEl = document.getElementById('pin-help');
  const PIN_KEY = 'app-pin';
  const LOCAL_KEY = 'shopapp-unlocked-with';
  const pinStore = makeFirestoreStorage('billing_kv');
  let mode = 'checking'; // 'set' | 'unlock' | 'change'
  let cloudPin = null;   // { hash, salt }

  function fingerprint(pin, salt){
    const s = salt + ':' + pin + ':shop-app';
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let r = 0; r < 500; r++){ // repeated so guessing is slow
      for (let i = 0; i < s.length; i++){
        const ch = s.charCodeAt(i) + r;
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    }
    return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36);
  }
  function localGet(){ try { return localStorage.getItem(LOCAL_KEY); } catch (e) { return null; } }
  function localSet(v){ try { if (v) localStorage.setItem(LOCAL_KEY, v); else localStorage.removeItem(LOCAL_KEY); } catch (e) {} }

  function showLock(newMode, message){
    mode = newMode;
    lockEl.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    titleEl.textContent = newMode === 'set' ? 'Set a PIN' : newMode === 'change' ? 'Change PIN' : 'Shop App';
    msgEl.textContent = message;
    errEl.textContent = '';
    const typing = newMode !== 'checking';
    in1.style.display = typing ? 'block' : 'none';
    in2.style.display = (newMode === 'set' || newMode === 'change') ? 'block' : 'none';
    goBtn.style.display = typing ? 'block' : 'none';
    goBtn.textContent = newMode === 'unlock' ? 'Unlock' : 'Save PIN';
    helpEl.style.display = newMode === 'unlock' ? 'block' : 'none';
    document.getElementById('pin-cancel-btn').style.display = newMode === 'change' ? 'block' : 'none';
    in1.value = ''; in2.value = '';
    in1.placeholder = newMode === 'unlock' ? 'PIN' : 'New PIN';
    if (typing) setTimeout(() => in1.focus(), 50);
  }
  function hideLock(){
    lockEl.style.display = 'none';
    document.body.style.overflow = '';
  }

  async function savePin(pin){
    const salt = Math.random().toString(36).slice(2, 10);
    const rec = { hash: fingerprint(pin, salt), salt };
    await pinStore.set(PIN_KEY, JSON.stringify(rec));
    cloudPin = rec;
    localSet(rec.hash);
  }

  async function submit(){
    errEl.textContent = '';
    const p1 = in1.value.trim(), p2 = in2.value.trim();
    if (!/^\d{4,8}$/.test(p1)){ errEl.textContent = 'PIN must be 4 to 8 digits.'; return; }
    if (mode === 'unlock'){
      if (cloudPin && fingerprint(p1, cloudPin.salt) === cloudPin.hash){
        localSet(cloudPin.hash);
        hideLock();
      } else {
        errEl.textContent = 'Wrong PIN — try again.';
        in1.value = '';
      }
      return;
    }
    if (p1 !== p2){ errEl.textContent = 'The two PINs don\'t match.'; return; }
    goBtn.disabled = true; goBtn.textContent = 'Saving...';
    try {
      await savePin(p1);
      hideLock();
      if (mode === 'change') alert('PIN changed ✓ — other phones will ask for the new PIN next time.');
    } catch (e) {
      errEl.textContent = 'Could not save the PIN — check your internet and try again.';
    } finally {
      goBtn.disabled = false; goBtn.textContent = 'Save PIN';
    }
  }
  goBtn.addEventListener('click', submit);
  document.getElementById('pin-cancel-btn').addEventListener('click', hideLock);
  [in1, in2].forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));

  async function start(){
    showLock('checking', 'Checking...');
    let r;
    try {
      r = await pinStore.get(PIN_KEY);
    } catch (e) {
      // Offline: a phone that was already unlocked keeps working.
      if (localGet()) { hideLock(); return; }
      showLock('checking', 'Can\'t reach the internet to check the PIN. Connect and reopen the app.');
      return;
    }
    if (!r || !r.value){
      showLock('set', 'Choose a 4–8 digit PIN for your shop app. Everyone using the app will need it once on each phone.');
      return;
    }
    try { cloudPin = JSON.parse(r.value); } catch (e) { cloudPin = null; }
    if (cloudPin && localGet() === cloudPin.hash){ hideLock(); return; }
    showLock('unlock', 'Enter your shop PIN.');
  }

  // 🔒 menu
  const menuBtn = document.getElementById('pin-menu-btn');
  const menu = document.getElementById('pin-menu');
  menuBtn.addEventListener('click', (e) => { e.stopPropagation(); menu.style.display = menu.style.display === 'none' ? 'block' : 'none'; });
  document.addEventListener('click', () => { menu.style.display = 'none'; });
  document.getElementById('pin-lock-now').addEventListener('click', () => {
    localSet(null);
    showLock('unlock', 'Locked. Enter your shop PIN.');
  });
  document.getElementById('pin-change').addEventListener('click', () => {
    // This phone is already unlocked, so it's trusted to set a new PIN.
    showLock('change', 'Type a new 4–8 digit PIN twice. All phones will need the new PIN once.');
  });

  start();
})();
</script>

// ---- "Add to Home Screen" ----
(function(){
  const btn = document.getElementById('install-btn');
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone;
  if (standalone) btn.style.display = 'none'; // already opened from the home-screen icon
  let deferred = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; btn.style.display = ''; });
  window.addEventListener('appinstalled', () => { deferred = null; btn.style.display = 'none'; });
  btn.addEventListener('click', async () => {
    if (deferred){
      deferred.prompt();
      try { await deferred.userChoice; } catch (e) {}
      deferred = null;
      return;
    }
    if (location.protocol !== 'https:'){
      alert('To add this app to your home screen, open it from its web address (your GitHub link) — not from a downloaded or WhatsApp file.');
      return;
    }
    alert('Your phone didn\'t offer the quick install, so add it from the browser menu:\n\n• Chrome: tap ⋮ (top-right) → "Add to Home screen" (or "Install app")\n• Samsung Internet: tap ☰ → "Add page to" → "Home screen"');
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker not registered:', err));
  }
})();
</script>

<script>
// ===================== Combo Maker (separate app, same cloud catalogue) =====================
const storage = makeFirestoreStorage('catalogue_kv');
function indexKey(catId){ return 'index:' + catId; }
function itemKey(catId, itemId){ return 'item:' + catId + ':' + itemId; }
function makeId(){ return 'cat-' + Date.now() + '-' + Math.floor(Math.random() * 1000); }
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
let catalogues = [];
let currentCatalogueId = null;          // no catalogue is "open" here — combos are written straight to the chosen catalogue
let items = [], itemsLoadFailed = false;
function renderGrid(){} function renderCatalogueSelect(){}
async function saveItemToStorage(){}
async function saveCatalogueList(){ await storage.set('catalogue-list', JSON.stringify(catalogues), true); }
const photoKey = (catId, itemId) => 'photo:' + catId + ':' + itemId;
const fullPhotoCache = new Map();  // photoKey -> full photo
const photoDirty = new Set();      // product ids whose full photo still has to be saved

function itemPhoto(item){ return (item && (item.thumb || item.dataUrl)) || ''; }

// ---- TYPES: one product, several looks (e.g. AC-42 BEST BATSMAN / BEST BOWLER) ----
// Sizes & prices stay shared. Each type keeps a small photo in the product
// record and its full photo in its own record "photo:<catalogue>:<id>~<type>".
const typePhotoKey = (catId, itemId, typeId) => photoKey(catId, itemId + '~' + typeId);
function itemTypes(item){ return Array.isArray(item && item.types) ? item.types.filter(t => t && t.id) : []; }
// A type can have its own sizes & prices (e.g. a bigger base); otherwise it uses the product's sizes.
function typeHasOwnSizes(t){ return !!(t && Array.isArray(t.variations) && t.variations.length); }
function typeVariations(item, t){ return typeHasOwnSizes(t) ? t.variations : ((item && item.variations) || []); }
async function fetchTypePhoto(catId, item, t){
  if (t.dataUrl) return t.dataUrl;
  const k = typePhotoKey(catId, item.id, t.id);
  if (fullPhotoCache.has(k)) return fullPhotoCache.get(k);
  let v = '';
  try { const r = await storage.get(k); v = r && r.value ? r.value : ''; } catch (e) { console.error(e); }
  if (!v) v = t.thumb || '';
  fullPhotoCache.set(k, v);
  return v;
}
// For PDF / photo zip: a product with types becomes one entry per photo.
async function expandTypes(list, catId){
  catId = catId || currentCatalogueId;
  const out = [];
  for (const it of list){
    const ts = itemTypes(it);
    if (!ts.length){ out.push(it); continue; }
    out.push(Object.assign({}, it, { name: it.name + (it.mainTypeName ? ' ' + it.mainTypeName : '') }));
    const photos = await Promise.all(ts.map(t => fetchTypePhoto(catId, it, t)));
    ts.forEach((t, i) => out.push(Object.assign({}, it, { id: it.id + '~' + t.id, name: it.name + ' ' + t.name, thumb: t.thumb, dataUrl: photos[i], variations: typeVariations(it, t), types: undefined, mainTypeName: undefined })));
  }
  return out;
}
const cardTypeSel = new Map(); // product id -> type id shown on its card ('' = main photo)

function makeThumb(dataUrl){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 360;
      const scale = Math.min(1, max / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
      const w = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
      const h = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL("image/jpeg", 0.7));
    };

// Removes a plain (white / single-colour) photo background so the product
// stands on the ad. Returns null when the background isn't plain enough.
function adCutout(im){
  const maxSide = 900;
  const sc = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.max(1, Math.round(im.naturalWidth * sc)), h = Math.max(1, Math.round(im.naturalHeight * sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.drawImage(im, 0, 0, w, h);
  let data;
  try { data = ctx.getImageData(0, 0, w, h); } catch (e) { return null; }
  const d = data.data;
  const px = (x, y) => (y * w + x) * 4;
  const corners = [px(1, 1), px(w - 2, 1), px(1, h - 2), px(w - 2, h - 2)].map(i => [d[i], d[i + 1], d[i + 2]]);
  const bg = [0, 1, 2].map(k => corners.reduce((a, c2) => a + c2[k], 0) / 4);
  const spread = Math.max(...corners.map(c2 => Math.abs(c2[0] - bg[0]) + Math.abs(c2[1] - bg[1]) + Math.abs(c2[2] - bg[2])));
  if (spread > 60) return null; // busy background — keep the photo as it is
  const tol = 70;
  const dist = (i) => Math.abs(d[i] - bg[0]) + Math.abs(d[i + 1] - bg[1]) + Math.abs(d[i + 2] - bg[2]);
  const seen = new Uint8Array(w * h);
  const queue = new Int32Array(w * h);
  let qh = 0, qt = 0;
  const push = (x, y) => { const k = y * w + x; if (seen[k]) return; seen[k] = 1; if (dist(k * 4) <= tol){ queue[qt++] = k; } };
  for (let x = 0; x < w; x++){ push(x, 0); push(x, h - 1); }
  for (let y = 0; y < h; y++){ push(0, y); push(w - 1, y); }
  while (qh < qt){
    const k = queue[qh++]; d[k * 4 + 3] = 0;
    const x = k % w, y = (k - x) / w;
    if (x > 0) push(x - 1, y); if (x < w - 1) push(x + 1, y); if (y > 0) push(x, y - 1); if (y < h - 1) push(x, y + 1);
  }
  const removed = qt / (w * h);
  if (removed < 0.08) return null; // almost nothing removed — not a plain background
  // soften the edge: pixels touching the removed area fade a little
  for (let y = 1; y < h - 1; y++){
    for (let x = 1; x < w - 1; x++){
      const k = y * w + x; if (d[k * 4 + 3] === 0) continue;
      if (d[(k - 1) * 4 + 3] === 0 || d[(k + 1) * 4 + 3] === 0 || d[(k - w) * 4 + 3] === 0 || d[(k + w) * 4 + 3] === 0){
        const dd = dist(k * 4); if (dd < tol * 2.2) d[k * 4 + 3] = Math.round(255 * Math.min(1, dd / (tol * 2.2)) * 0.9 + 25);
      }
    }
  }
  ctx.putImageData(data, 0, 0);
  // trim to the product
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 20){ if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  if (maxX < 0) return null;
  const t = document.createElement('canvas'); t.width = maxX - minX + 1; t.height = maxY - minY + 1;
  t.getContext('2d').drawImage(c, minX, minY, t.width, t.height, 0, 0, t.width, t.height);
  return t;
}
function adCrown(ctx, cx, cy, w){
  const h = w * 0.62;
  ctx.save();
  ctx.fillStyle = adGoldGradient(ctx, cy - h / 2, cy + h / 2);
  ctx.beginPath();

}

async function smartCutout(dataUrl, key, onStatus){

  if (smartCutCache.has(fingerprint + (keepMid0 ? ':fill' : ''))) return smartCutCache.get(fingerprint + (keepMid0 ? ':fill' : ''));

// The AI sometimes removes a plain part in the MIDDLE of the trophy (e.g. the
// gold disc inside a ring). Any see-through area that is fully surrounded by
// the trophy and is not tiny is put back from the original photo.
function fillEnclosedHoles(cutImg, origImg){
  const w = cutImg.naturalWidth || cutImg.width, h = cutImg.naturalHeight || cutImg.height;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(cutImg, 0, 0);
  const o = document.createElement('canvas'); o.width = w; o.height = h;
  o.getContext('2d').drawImage(origImg, 0, 0, w, h, 0, 0, w, h);
  let cd, od;
  try { cd = x.getImageData(0, 0, w, h); od = o.getContext('2d').getImageData(0, 0, w, h).data; } catch (e) { return null; }
  const d = cd.data, N = w * h;
  const state = new Uint8Array(N); // 0 = unvisited, 1 = solid, 2 = outside, 3 = hole
  let solid = 0;
  for (let i = 0; i < N; i++) if (d[i * 4 + 3] >= 128){ state[i] = 1; solid++; }
  const stack = new Int32Array(N);
  let sp = 0;
  const seed = (i) => { if (state[i] === 0){ state[i] = 2; stack[sp++] = i; } };
  for (let i = 0; i < w; i++){ seed(i); seed((h - 1) * w + i); }
  for (let j = 0; j < h; j++){ seed(j * w); seed(j * w + w - 1); }
  while (sp){ const i = stack[--sp], px = i % w; if (px > 0) seed(i - 1); if (px < w - 1) seed(i + 1); if (i >= w) seed(i - w); if (i < N - w) seed(i + w); }
  const minSize = Math.max(60, solid * 0.004);
  let changed = false;
  for (let i0 = 0; i0 < N; i0++){
    if (state[i0] !== 0) continue;
    const comp = []; state[i0] = 3; stack[0] = i0; sp = 1;
    while (sp){ const i = stack[--sp]; comp.push(i); const px = i % w;
      const nb = [px > 0 ? i - 1 : -1, px < w - 1 ? i + 1 : -1, i >= w ? i - w : -1, i < N - w ? i + w : -1];
      for (const n of nb) if (n >= 0 && state[n] === 0){ state[n] = 3; stack[sp++] = n; } }
    if (comp.length >= minSize){
      for (const i of comp){ d[i * 4] = od[i * 4]; d[i * 4 + 1] = od[i * 4 + 1]; d[i * 4 + 2] = od[i * 4 + 2]; d[i * 4 + 3] = 255; }
      changed = true;
    }
  }
  if (!changed) return null;
  x.putImageData(cd, 0, 0);
  return c;
}

// Removes the faint mirror-reflection under a cut-out product (AI keeps it,
// so the trophy would float above the base). Real product rows are almost
// fully solid; reflection rows are see-through.
function cutReflection(cv){
  const w = cv.width, h = cv.height;
  let d;
  try { d = cv.getContext('2d').getImageData(0, 0, w, h).data; } catch (e) { return cv; }
  // The AI keeps the mirror reflection under the product as see-through
  // pixels; the product itself is solid. Find the lowest solid rows.
  const step = Math.max(1, Math.round(w / 300));
  let bottom = h - 1;
  for (let y = h - 1, run = 0; y > h * 0.35; y--){
    let any = 0, strong = 0;
    for (let x = 0; x < w; x += step){ const a = d[(y * w + x) * 4 + 3]; if (a > 20){ any++; if (a > 200) strong++; } }
    if (any > 0 && strong >= 2 && strong / any > 0.7){ if (++run >= 3){ bottom = y + 2; break; } } else run = 0;
  }
  if (bottom >= h - 3) return cv;
  const t = document.createElement('canvas'); t.width = w; t.height = bottom + 1;
  t.getContext('2d').drawImage(cv, 0, 0, w, bottom + 1, 0, 0, w, bottom + 1);
  return t;
}

  const rnd = (() => { let x = 12345; return () => (x = x * 16807 % 2147483647) / 2147483647; })();
  const bokeh = (count, col, maxA, yMax) => {
    for (let i = 0; i < count; i++){
      const x = rnd() * W, y = rnd() * yMax, r = 14 + rnd() * 60, a = 0.05 + rnd() * maxA;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(' + col + ',' + a + ')'); g.addColorStop(0.6, 'rgba(' + col + ',' + a * 0.5 + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  };
  const lin = (y0, y1, stops) => { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
  const rad = (cx, cy, r0, r1, stops) => { const g = ctx.createRadialGradient(cx, cy, r0, cx, cy, r1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
  if (name === 'white'){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H); return; }
  if (name === 'gold'){
    ctx.fillStyle = rad(W * 0.5, H * 0.38, 40, H * 0.8, [[0, '#7a5518'], [0.45, '#2e1e08'], [1, '#0b0703']]); ctx.fillRect(0, 0, W, H);
    // warm light pillars like a showroom
    [[0.12, 0.10], [0.88, 0.10]].forEach(([fx, wv]) => { ctx.fillStyle = lin(0, floorY, [[0, 'rgba(255,200,110,0.0)'], [0.4, 'rgba(255,200,110,0.22)'], [1, 'rgba(255,200,110,0.05)']]); ctx.fillRect(W * fx - W * wv / 2, 0, W * wv, floorY); });
    bokeh(46, '255,205,120', 0.32, floorY);
    ctx.fillStyle = lin(floorY - 30, H, [[0, '#d9cbb3'], [0.25, '#efe6d6'], [1, '#a8957a']]); ctx.fillRect(0, floorY - 30, W, H - floorY + 30);
    ctx.strokeStyle = 'rgba(120,100,80,0.18)'; ctx.lineWidth = 2;
    for (let i = 0; i < 9; i++){ ctx.beginPath(); const x0 = rnd() * W; ctx.moveTo(x0, floorY - 20); ctx.bezierCurveTo(x0 + 120 * (rnd() - 0.5), floorY + 60, x0 + 200 * (rnd() - 0.5), floorY + 140, x0 + 260 * (rnd() - 0.5), H); ctx.stroke(); }
    ctx.fillStyle = lin(floorY - 40, floorY + 10, [[0, 'rgba(255,220,160,0)'], [1, 'rgba(255,220,160,0.35)']]); ctx.fillRect(0, floorY - 40, W, 50);
    return;
  }
  if (name === 'dark'){
    ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = rad(W / 2, H * 0.35, 30, H * 0.6, [[0, 'rgba(255,240,210,0.22)'], [1, 'rgba(255,240,210,0)']]); ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = lin(0, floorY, [[0, 'rgba(255,236,190,0.16)'], [1, 'rgba(255,236,190,0.02)']]);
    ctx.beginPath(); ctx.moveTo(W / 2 - 90, 0); ctx.lineTo(W / 2 + 90, 0); ctx.lineTo(W / 2 + 380, floorY); ctx.lineTo(W / 2 - 380, floorY); ctx.closePath(); ctx.fill();
    bokeh(18, '255,215,150', 0.12, floorY * 0.9);
    ctx.fillStyle = lin(floorY - 20, H, [[0, '#1d1d1f'], [1, '#050505']]); ctx.fillRect(0, floorY - 20, W, H - floorY + 20);
    ctx.save(); ctx.translate(W / 2, floorY); ctx.scale(1, 0.18); ctx.fillStyle = rad(0, 0, 10, 420, [[0, 'rgba(255,230,180,0.35)'], [1, 'rgba(255,230,180,0)']]); ctx.beginPath(); ctx.arc(0, 0, 420, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    return;
  }
  if (name === 'studio'){
    ctx.fillStyle = rad(W / 2, H * 0.35, 50, H * 0.9, [[0, '#ffffff'], [1, '#cfd3d8']]); ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = lin(floorY - 60, H, [[0, 'rgba(210,214,220,0)'], [0.3, '#dfe2e6'], [1, '#bfc4ca']]); ctx.fillRect(0, floorY - 60, W, H - floorY + 60);
    return;
  }
  if (name === 'velvet'){
    ctx.fillStyle = rad(W / 2, H * 0.36, 40, H * 0.85, [[0, '#8e1b24'], [0.5, '#4a0a10'], [1, '#170204']]); ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 14; i++){ const x = (i + 0.5) * W / 14; ctx.fillStyle = lin(0, floorY, [[0, 'rgba(0,0,0,0.0)'], [1, 'rgba(0,0,0,0.18)']]); ctx.fillRect(x - 10, 0, 20, floorY); }   // curtain folds
    bokeh(22, '255,200,150', 0.14, floorY);
    ctx.fillStyle = lin(floorY - 20, H, [[0, '#5a3418'], [0.4, '#3e2310'], [1, '#1d0f06']]); ctx.fillRect(0, floorY - 20, W, H - floorY + 20);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 2;
    for (let y = floorY + 10; y < H; y += 26){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y + 6); ctx.stroke(); }
    return;
  }
  if (name === 'blue'){
    ctx.fillStyle = rad(W / 2, H * 0.36, 40, H * 0.85, [[0, '#1f4fa8'], [0.5, '#0c2457'], [1, '#040a1c']]); ctx.fillRect(0, 0, W, H);
    bokeh(40, '170,210,255', 0.22, floorY);
    ctx.fillStyle = lin(floorY - 20, H, [[0, '#1b2d55'], [1, '#050b1a']]); ctx.fillRect(0, floorY - 20, W, H - floorY + 20);
    ctx.save(); ctx.translate(W / 2, floorY); ctx.scale(1, 0.18); ctx.fillStyle = rad(0, 0, 10, 420, [[0, 'rgba(180,215,255,0.35)'], [1, 'rgba(180,215,255,0)']]); ctx.beginPath(); ctx.arc(0, 0, 420, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    return;
  }
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
}
function comboRenderBgChips(){
  const box = comboModal.querySelector('.cm-bgs'); if (!box) return;
  const cur = comboLs('shopapp-combo-bg', 'white');
  box.innerHTML = '';
  COMBO_BGS.forEach(([id, label]) => {
    const b = document.createElement('button'); b.type = 'button';
    const on = id === cur;
    b.style.cssText = 'padding:8px 12px; border-radius:16px; font-weight:800; font-size:13px; border:2px solid ' + (on ? '#f0c341' : '#444') + '; background:' + (on ? '#f0c341' : '#141414') + '; color:' + (on ? '#000' : '#ddd') + ';';
    b.textContent = label;
    b.onclick = () => { comboLsSet('shopapp-combo-bg', id); comboRenderBgChips(); comboDraw(); };
    box.appendChild(b);
  });
}

function comboDraw(){
  const q = (s) => comboModal.querySelector(s);
  const layersRaw = (comboState.layers || []).map(l => Object.assign({}, l, { cut: l.noRefl || (l.noRefl = cutReflection(l.cut)) }));
  if (!layersRaw.length) return;
  // manual reflection cut (from the ✂️ sliders): crop that share off the bottom
  const cTop = (parseFloat(q('.cm-ctop').value) || 0) / 100, cBot = (parseFloat(q('.cm-cbot').value) || 0) / 100;
  const layers = layersRaw.map((l, i) => {
    const pct = i === 0 ? cTop : (i === layersRaw.length - 1 ? cBot : 0);
    if (!pct) return l;
    const hh = Math.max(1, Math.round(l.cut.height * (1 - pct)));
    const t = document.createElement('canvas'); t.width = l.cut.width; t.height = hh;
    t.getContext('2d').drawImage(l.cut, 0, 0, l.cut.width, hh, 0, 0, l.cut.width, hh);
    return Object.assign({}, l, { cut: t });
  });
  const lift = (parseFloat(q('.cm-lift').value) || 0) / 100;   // top part up(+)/down(−), share of the part below
  const grow = (parseFloat(q('.cm-grow').value) || 100) / 100; // top part size
  // heights: by inches when known, else by the photo's own proportion
  const known = layers.filter(l => l.inch > 0);
  const avgPxPerInch = known.length ? known.reduce((a, l) => a + l.cut.height / l.inch, 0) / known.length : 0;
  layers.forEach(l => { l.h = l.inch > 0 ? l.inch : (avgPxPerInch ? l.cut.height / avgPxPerInch : 4); });
  if (layers.length > 1) layers[0].h *= grow;
  const W = 1000, H = 1300, M = 60, sink = 0.06; // upper part stands slightly into the top face of the part below
  const totalIn = layers.reduce((a, l, i) => a + (i === layers.length - 1 ? l.h : 0), 0) +
    layers.slice(0, -1).reduce((a, l, i) => a + l.h, 0) - layers.slice(1).reduce((a, l, i) => a + l.h * (i === 0 ? sink - lift : sink), 0);
  // scale is worked out without the up/down nudge, so moving the trophy never resizes everything
  const totalNoLift = totalIn - (layers.length > 1 ? layers[1].h * lift : 0);
  let k = (H - 2 * M) / Math.max(1, totalNoLift);
  layers.forEach(l => { const w = l.cut.width * (l.h * k) / l.cut.height; if (w > W - 2 * M) k = Math.min(k, (W - 2 * M) * l.cut.height / (l.cut.width * l.h)); });
  const bgName = comboLs('shopapp-combo-bg', 'white');
  const onScene = bgName !== 'white';
  if (onScene) k *= 0.86;                       // leave room for the floor
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  // 1) the trophy stack on a transparent layer
  const stack = document.createElement('canvas'); stack.width = W; stack.height = H;
  const sx = stack.getContext('2d');
  const floorY = onScene ? Math.round(H * 0.84) : (H + totalIn * k) / 2;
  let bottom = floorY;
  const last = layers[layers.length - 1];
  const baseW = last.cut.width * (last.h * k) / last.cut.height;
  for (let i = layers.length - 1; i >= 0; i--){
    const l = layers[i]; const h = l.h * k; const w = l.cut.width * h / l.cut.height;
    sx.drawImage(l.cut, (W - w) / 2, bottom - h, w, h);
    const s2 = (i === 1) ? sink - lift : sink;   // joint between part 1 (top) and part 2
    bottom = bottom - h * (1 - s2);
  }
  // 2) background scene, 3) reflection + contact shadow, 4) trophy
  comboPaintScene(ctx, W, H, floorY, bgName);
  const glossy = { gold: 0.22, dark: 0.26, studio: 0.12, velvet: 0.18, blue: 0.24 }[bgName] || 0;
  if (glossy){
    const r = document.createElement('canvas'); r.width = W; r.height = H; const rx = r.getContext('2d');
    rx.translate(0, floorY * 2); rx.scale(1, -1); rx.drawImage(stack, 0, 0); rx.setTransform(1, 0, 0, 1, 0, 0);
    rx.globalCompositeOperation = 'destination-in';
    const fade = rx.createLinearGradient(0, floorY, 0, floorY + H * 0.16);
    fade.addColorStop(0, 'rgba(0,0,0,' + glossy + ')'); fade.addColorStop(1, 'rgba(0,0,0,0)');
    rx.fillStyle = fade; rx.fillRect(0, floorY, W, H - floorY);
    ctx.drawImage(r, 0, 0);
  }
  ctx.save();
  ctx.filter = 'blur(10px)';
  ctx.fillStyle = onScene ? 'rgba(0,0,0,0.45)' : 'rgba(0,0,0,0.14)';
  ctx.beginPath(); ctx.ellipse(W / 2, floorY - 2, baseW * 0.52, onScene ? 18 : 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.drawImage(stack, 0, 0);
  if (onScene){   // soft light from above + gentle vignette, so it feels like one photo
    const vg = ctx.createRadialGradient(W / 2, H * 0.42, H * 0.25, W / 2, H * 0.5, H * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,' + (bgName === 'studio' ? 0.12 : 0.35) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  comboImage = c.toDataURL('image/jpeg', 0.92);
  q('.cm-preview').src = comboImage;
}
async function comboSave(){
  const q = (s) => comboModal.querySelector(s);
  if (comboState.parts.some(p => !p)){ alert('Please choose every part first (or Remove the empty one).'); return; }
  if (!comboImage){ alert('The photo is still being made — wait a moment.'); return; }
  const name = q('.cm-name').value.trim();
  if (!name){ alert('Please enter a model number / name.'); return; }
  const variation = { code: q('.cm-code').value.trim(), inch: q('.cm-inch').value.trim(), price: q('.cm-mrp').value.trim() };
  const destId = q('.cm-dest').value;
  const btn = q('.cm-save'); btn.disabled = true; q('.cm-status').style.color = '#f0c341'; q('.cm-status').textContent = '⏳ Saving...';
  try {
    const parts = comboState.parts.map(p => ({ name: p.item.name, size: p.v.code || '', inch: p.v.inch || '', mrp: p.v.price || '' }));
    const rodVal = parseFloat(q('.cm-rod').value) || 0;
    if (rodVal > 0) parts.push({ name: 'ROD', rodPrice: rodVal, rodType: q('.cm-rodtype').value });
    if (destId === currentCatalogueId){
      if (itemsLoadFailed) throw new Error('This catalogue did not load properly — tap Refresh first.');
      const existing = items.find(i => i.name.trim().toUpperCase() === name.toUpperCase());
      if (existing && confirm('"' + name + '" already exists here. Add this as another size to it?\n\nOK = add size · Cancel = stop')){
        existing.variations = (existing.variations || []).concat([variation]);
        renderGrid(); await saveItemToStorage(existing);
      } else if (existing){ throw new Error('cancelled'); }
      else {
        const it = { id: Date.now(), dataUrl: comboImage, name, variations: [variation], comboParts: parts };
        items.push(it); photoDirty.add(it.id); renderGrid(); await saveItemToStorage(it);
      }
    } else {
      const list = await comboLoadCatalogueItems(destId).catch(() => null);
      if (!list) throw new Error('Could not open that catalogue — check internet.');
      const existing = list.find(i => String(i.name).trim().toUpperCase() === name.toUpperCase());
      if (existing){
        if (!confirm('"' + name + '" already exists there. Add this as another size to it?')) throw new Error('cancelled');
        existing.variations = (existing.variations || []).concat([variation]);
        const light = { ...existing }; delete light.dataUrl;
        await storage.set(itemKey(destId, existing.id), JSON.stringify(light), true);
      } else {
        const it = { id: Date.now(), dataUrl: comboImage, name, variations: [variation], comboParts: parts };
        const { light, full } = await splitItem(it);
        if (full) await storage.set(photoKey(destId, it.id), full);   // photo first
        await storage.set(itemKey(destId, it.id), JSON.stringify(light), true);
        const idx = await storage.get(indexKey(destId));
        const ids = idx && idx.value ? JSON.parse(idx.value) : [];
        ids.push(it.id);
        await storage.set(indexKey(destId), JSON.stringify(ids), true);
        list.push(light);
      }
    }
    const destName = (catalogues.find(c => c.id === destId) || {}).name || '';
    q('.cm-status').style.color = '#7cd992';
    q('.cm-status').textContent = '✅ Saved "' + name + '" (' + (variation.code ? 'Size ' + variation.code + ', ' : '') + (variation.inch ? variation.inch + '", ' : '') + 'MRP ₹' + variation.price + ') in ' + destName + '. Choose new parts to make the next one.';
    q('.cm-name').dataset.touched = '';
  } catch (e) {
    if (e && e.message === 'cancelled'){ q('.cm-status').textContent = ''; }
    else { console.error(e); q('.cm-status').style.color = '#e0705a'; q('.cm-status').textContent = '⚠️ Not saved: ' + (e && e.message ? e.message : e); }
  } finally { btn.disabled = false; }
}


(async function startCombo(){
  const msg = document.getElementById('combo-loading');
  try {
    const r = await storage.get('catalogue-list');
    catalogues = r && r.value ? JSON.parse(r.value) : [];
  } catch (e) { msg.textContent = '⚠️ Could not load your catalogues — check the internet and reopen.'; return; }
  if (!catalogues.length){ msg.textContent = 'No catalogues yet — add products in the Catalogue app first.'; return; }
  msg.style.display = 'none';
  openComboMaker();
  const close = comboModal.querySelector('.cm-close');
  close.textContent = '📚 Catalogue';
  close.onclick = () => { location.href = 'catalogue.html'; };
  comboModal.style.top = document.getElementById('app-topbar').offsetHeight + 'px';
})();
